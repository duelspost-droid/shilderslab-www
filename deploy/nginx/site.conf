# ═══════════════════════════════════════════════════════════════════════════
# 정적 사이트 + API 게이트웨이
#
# supabase-js 는 {SUPABASE_URL}/rest/v1 · /auth/v1 · /functions/v1 로 호출한다.
# 그 경로를 그대로 받아 내부 서비스로 넘기면 **프런트 코드를 고칠 필요가 없다.**
# (config.js 의 URL 과 anon 키, CSP 의 connect-src 만 바꾼다.)
#
# ★ GitHub Pages 에서 못 하던 것을 여기서 한다 — HSTS·보안 헤더·레이트리밋.
#   HANDOFF 4항에 "Pages 한계라 CDN 앞단으로만 해결" 로 남아 있던 항목이 여기서 해소된다.
# ═══════════════════════════════════════════════════════════════════════════

# 로그인 무차별 대입 방어. GoTrue 자체 제한과 별개로 앞단에서 한 겹 더 막는다.
limit_req_zone $binary_remote_addr zone=authzone:10m rate=10r/m;
# 문의·지원 제출. DB RPC 안에도 레이트리밋이 있지만(0003) 앞단에서 먼저 끊는다.
limit_req_zone $binary_remote_addr zone=restzone:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # certbot 갱신 경로만 열고 나머지는 전부 https 로
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # ── 보안 헤더 ────────────────────────────────────────────────────────
    # ⚠ HSTS 는 되돌리기 어렵다. 인증서가 정상 발급되고 https 가 확실히 동작하는 것을
    #   확인한 뒤에 preload 를 붙인다. 처음에는 max-age 를 짧게 두고 늘리는 편이 안전하다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # CSP 는 페이지마다 <meta> 로 이미 걸려 있다(tools/shell.py). 여기서 중복 선언하면
    # 둘 중 **더 엄격한 쪽이 적용**되어 디버깅이 어려워지므로 넣지 않는다.

    client_max_body_size 2m;

    # ── 인증 (GoTrue) ───────────────────────────────────────────────────
    location /auth/v1/ {
        limit_req zone=authzone burst=20 nodelay;
        proxy_pass http://auth:9999/;          # 끝의 / 가 /auth/v1 접두를 떼어 낸다
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── REST (PostgREST) ────────────────────────────────────────────────
    location /rest/v1/ {
        limit_req zone=restzone burst=60 nodelay;
        proxy_pass http://rest:3000/;
        proxy_set_header Host              $host;
        # 🚨 이 헤더가 RPC 의 IP 레이트리밋 근거다(0003 의 _sl_client_ip).
        #    빠뜨리면 모든 요청이 같은 IP 로 보여 제한이 무의미해진다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Profile    public;
        proxy_set_header Content-Profile   public;
    }

    # ── Edge 이식 서비스 ────────────────────────────────────────────────
    location /functions/v1/sl-admin-user {
        proxy_pass http://adminfn:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 정의하지 않은 함수 경로는 열지 않는다
    location /functions/ { return 404; }

    # ── 정적 사이트 ─────────────────────────────────────────────────────
    root /var/www/site;
    index index.html;

    # 해시가 없는 파일명이라 공격적으로 캐시하지 않는다. 자산만 길게 잡는다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    # 관리자 콘솔은 캐시하지 않는다(로그인 상태·권한이 섞이면 곤란하다)
    location /admin/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # 디렉터리 URL(/about/ → /about/index.html), 없으면 404 페이지
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;

    # 저장소 내부 파일이 그대로 서빙되지 않게 막는다
    location ~ ^/(tools|supabase|deploy|\.git|\.github)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
}

# ───────────────────────────────────────────────────────────────────────────
# 내부 전용 서버 (컨테이너 네트워크에서만 접근) — adminfn 이 쓴다.
# ⚠ compose 에서 이 포트를 publish 하지 않는다. 바깥에 열리면 인증 없는 REST 경로가 된다.
#   (그래도 PostgREST 는 JWT 를 요구하므로 2차 방어는 남아 있다.)
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 8081;
    server_name _;
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Accept-Profile  public;
        proxy_set_header Content-Profile public;
    }
    location / { return 404; }
}
