# ═══════════════════════════════════════════════════════════════════════════
# Apache httpd 2.4 — nginx/site.conf 와 동등한 구성 (SPEC 부록 C.3)
# 필요 모듈: ssl proxy proxy_http headers rewrite expires
# ⚠ 레이트리밋은 기본 모듈에 없다 — mod_evasive/mod_security 또는 앞단에서 처리할 것.
# ═══════════════════════════════════════════════════════════════════════════

<VirtualHost *:80>
    ServerName shielduslab.com
    ServerAlias www.shielduslab.com
    # certbot 검증 경로만 열고 나머지는 https 로
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName shielduslab.com
    ServerAlias www.shielduslab.com
    DocumentRoot /srv/shieldus

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/shielduslab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shielduslab.com/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    # ── 보안 헤더 (GitHub Pages 에서 못 하던 것) ──
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set X-Frame-Options           "DENY"
    Header always set Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # 🚨 X-Forwarded-For 는 mod_proxy 가 자동으로 붙인다. 이것이 RPC 레이트리밋의 근거다.

    # ── API 라우팅 (양쪽 슬래시 필수 — 접두가 떨어진다) ──
    ProxyPass        /auth/v1/ http://127.0.0.1:9999/
    ProxyPassReverse /auth/v1/ http://127.0.0.1:9999/
    <Location /rest/v1/>
        RequestHeader set Accept-Profile  "public"
        RequestHeader set Content-Profile "public"
    </Location>
    ProxyPass        /rest/v1/ http://127.0.0.1:3000/
    ProxyPassReverse /rest/v1/ http://127.0.0.1:3000/
    ProxyPass        /functions/v1/sl-admin-user http://127.0.0.1:8080
    ProxyPassReverse /functions/v1/sl-admin-user http://127.0.0.1:8080

    # 정의하지 않은 함수·저장소 내부 경로 차단
    RewriteEngine On
    RewriteRule ^/functions/(?!v1/sl-admin-user) - [R=404,L]
    RewriteRule ^/(tools|supabase|deploy|\.git|\.github)/ - [R=404,L]
    RewriteRule ^/\.(?!well-known) - [R=404,L]

    # ── 캐시 ──
    <Location /assets/>
        ExpiresActive On
        ExpiresDefault "access plus 30 days"
        Header set Cache-Control "public, max-age=2592000, immutable"
    </Location>
    <Location /admin/>
        Header always set Cache-Control "no-store"
    </Location>

    DirectoryIndex index.html
    ErrorDocument 404 /404.html
    <Directory /srv/shieldus>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

# ── 내부 전용 — adminfn 이 쓴다. 127.0.0.1 에만 묶는다 ──
Listen 127.0.0.1:8081
<VirtualHost 127.0.0.1:8081>
    ProxyPass        /auth/v1/ http://127.0.0.1:9999/
    ProxyPassReverse /auth/v1/ http://127.0.0.1:9999/
    ProxyPass        /rest/v1/ http://127.0.0.1:3000/
    ProxyPassReverse /rest/v1/ http://127.0.0.1:3000/
</VirtualHost>
